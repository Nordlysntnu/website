on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nordlys-deployment-test
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set repository Actions secrets NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY. Both are required for the website build."
            exit 1
          fi
          npm run build

      - name: Verify build
        run: test -f out/index.html

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: nordlys-build
          path: out/
          if-no-files-found: error

  deploy:
    name: Test Deployment on Nordlys Server
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      # The self-hosted runner keeps its workspace between runs. Without this,
      # files removed from the site stay in site/ and rsync keeps serving them.
      - name: Empty the build folder
        run: rm -rf site

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nordlys-build
          path: site/

      - name: Verify downloaded files
        run: |
          test -f site/index.html
          echo "Website build received!"

      - name: Test website deployment
        run: |
          set -euo pipefail

          echo "Starting Nordlys deployment run..."

          # After CMS cutover this path is an immutable-release symlink.
          # A legacy artifact must never overwrite a CMS-built release.
          if [ -L /var/www/nextapp ] || [ -f /var/www/nextapp/publication.json ]; then
            echo "CMS website publication is active. Use the dedicated publisher service."
            exit 1
          fi

          # List the files removed from the live site in the job log.
          rsync -a --delete-delay --delay-updates --itemize-changes \
          site/ /var/www/nextapp/ | { grep '^\*deleting' || true; }

          echo "Deployment run successful!"
          echo "Commit: $GITHUB_SHA"