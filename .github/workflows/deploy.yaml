on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nordlys-deployment-test
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify build
        run: test -f out/index.html

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: nordlys-build
          path: out/
          if-no-files-found: error

  deploy:
    name: Test Deployment on Nordlys Server
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nordlys-build
          path: site/

      - name: Verify downloaded files
        run: |
          test -f site/index.html
          echo "Website build received!"

      - name: Test website deployment
        run: |
          set -euo pipefail

          echo "Starting Nordlys deployment run..."

          rsync -a --delete-delay --delay-updates \
          site/ /var/www/nextapp/

          echo "Deployment dry run successful!"
          echo "Commit: $GITHUB_SHA"
