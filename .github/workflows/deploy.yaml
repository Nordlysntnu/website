
name: Deploy Nordlys Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nordlys-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify build
        run: test -f out/index.html

      - name: Upload website files
        uses: actions/upload-artifact@v4
        with:
          name: nordlys-build
          path: out/
          if-no-files-found: error

  deploy:
    name: Test Deployment on Nordlys Server
    needs: build
    if: github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: nordlys-build
          path: site/

      - name: Test website deployment
        run: |
          set -euo pipefail

          test -f site/index.html

          rsync -avhn --delete \
            site/ /var/www/nextapp/

          echo "✅ Deployment dry run successful!"
